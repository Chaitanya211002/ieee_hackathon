# BenchLog configuration. All model names, node URLs and thresholds live here.
# Replace WIN_IP with the Windows laptop's fixed LAN IP (e.g. 192.168.8.20). While it is the
# literal WIN_IP, the WIN node counts as "not configured" and every job runs on the M5.

nodes:
  m5:  {ollama: http://localhost:11434}
  win: {ollama: http://WIN_IP:11434, service: http://WIN_IP:8001}

routing:
  vision: m5
  docs: m5
  coder: win     # fallback m5
  audio: win     # fallback m5
  sandbox: win   # fallback m5

models:
  # The plain qwen3-vl:8b tag is the thinking variant: it ignores think=false and takes 2-3x
  # longer. The instruct build is the same model without the reasoning trace.
  vision: qwen3-vl:8b-instruct   # images, video frames
  text: qwen3-vl:8b-instruct     # doc Q&A, questions about transcripts (same weights, no extra RAM)
  coder: qwen2.5-coder:7b
  embed: nomic-embed-text
  whisper: mlx-community/whisper-large-v3-turbo   # M5 fallback (MLX, uses the Mac GPU)
  sound: MIT/ast-finetuned-audioset-10-10-0.4593

thresholds:
  doc_similarity: 0.35   # cosine similarity; below this -> "Not in your indexed protocols."
  sound_conf: 0.5        # only surface sound labels >= this in the summary
  no_speech_prob: 0.6    # local Whisper: drop segments the model thinks are not speech

llm:
  temperature: 0
  # One context size for every call: Ollama reloads a model whenever num_ctx changes.
  num_ctx: 16384
  keep_alive: -1         # keep models loaded between captures

vision:
  max_side: 1024         # images are downscaled to this long side before the VLM

colonies:
  # OpenCV blob count for plates. Areas are in pixels after resizing to max_side.
  max_side: 1024
  min_area: 12
  max_area_frac: 0.02    # ignore blobs bigger than this fraction of the plate area
  min_circularity: 0.55
  block_size: 51         # adaptive threshold neighbourhood (odd)
  c: 4

video:
  fps: 1
  max_frames: 10
  max_side: 768
  # Short clips (<max_frames s) get fewer than max_frames at 1 fps. When true, raise fps so
  # short clips still yield up to max_frames frames (helps motion/count questions).
  adaptive_fps: true
  # Ollama resizes every image to a fixed ~1k tokens (~10 s of prefill each on the M5), so
  # "sheets" tiles the ordered, timestamped frames into a few contact sheets instead of
  # sending each frame as its own image ("frames").
  mode: sheets
  frames_per_sheet: 5
  sheet_cols: 5

sandbox:
  timeout_s: 20
  max_retries: 2
  # Separate venv for the local (M5) sandbox; build it with scripts/setup_sandbox.sh.
  local_python: data/sandbox_venv/bin/python
  # macOS only: run code under sandbox-exec with all network access denied.
  os_network_block: true

docs:
  chunk_words: 500
  top_k: 4
  collection: protocols

health:
  interval_s: 5
  timeout_s: 2

timeouts:
  win_service_s: 60     # per request to the WIN service before falling back to m5
  ollama_s: 300

paths:
  data: data
  media: data/media
  db: data/benchlog.sqlite3
  chroma: data/chroma
  logs: data/logs
  practice_pack: data/practice-pack
  practice_meta: data/archive    # items.json / answers.json
